name: PR checks

on:
  pull_request:
    branches: [main]

# Required by the pinned reusable workflow for PR annotations and SARIF upload.
permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build-and-test:
    uses: kedify/github-meta/.github/workflows/go-pr-check.yaml@c9332258ab5bbe61f19115c3b4542fe18ff747fb
    with:
      continue_on_error: false
      skip_private_key_setup: true
